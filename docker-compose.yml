services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: aeshbuy
      POSTGRES_USER: aeshbuy
      POSTGRES_PASSWORD: aeshbuy
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeshbuy -d aeshbuy"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://aeshbuy:aeshbuy@postgres:5432/aeshbuy?schema=public
      REDIS_URL: redis://redis:6379
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    command: ["node", "dist/main.js"]
    ports:
      - "${API_PORT:-3002}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://aeshbuy:aeshbuy@postgres:5432/aeshbuy?schema=public
      REDIS_URL: redis://redis:6379
    command: ["node", "dist/worker.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
